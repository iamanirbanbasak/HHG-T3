[project]
name = "facechain"
version = "0.1.0"
description = "Face scan to social-media match to tamper-evident on-chain evidence"
requires-python = ">=3.11"
dependencies = [
    "insightface>=0.7.3",
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.9",
    "numpy>=1.26,<2.0",
    "Pillow>=10.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "web3[tester]>=6.15",
    "py-solc-x>=2.0",
    "eth-utils>=4.0",
    "pillow-heif>=0.16",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]
yandex = ["scrapling[fetchers]>=0.4"]

[project.scripts]
facechain = "facechain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/facechain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: requires real external services (deselected by default)"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py311"
